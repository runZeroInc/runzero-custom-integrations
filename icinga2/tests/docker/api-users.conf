/*
 * The two ApiUser objects this test needs.
 *
 * This file is configuration rather than something the seed script creates,
 * and that is forced rather than chosen: Icinga 2 has no runtime creation for
 * the ApiUser type, so an API credential cannot be minted over the API. It has
 * to exist on disk before the daemon starts, which is why the compose file
 * bind-mounts this into conf.d. Everything else -- the Host objects, the
 * service checks that get applied to them -- is created through the real API by
 * seed.py.
 *
 * There are two users on purpose. The integration is pointed at the read-only
 * one, so the run proves it works under least privilege; a permission it
 * quietly needed but nobody granted would fail here rather than at a customer.
 */

/* What the integration authenticates as. Query only: no create, no modify, no
 * actions. These three permissions are exactly what the script's three calls
 * require -- status/query for /v1/status/IcingaApplication, and the two object
 * queries for /v1/objects/hosts and /v1/objects/services. */
object ApiUser "runzero" {
  password = "runzero-test-pw-2026"
  permissions = [ "status/query", "objects/query/Host", "objects/query/Service" ]
}

/* What seed.py authenticates as, to create the Host objects. Kept separate so
 * that the credential under test never carries a permission the integration
 * does not need. */
object ApiUser "runzero-seed" {
  password = "runzero-seed-pw-2026"
  permissions = [ "*" ]
}
