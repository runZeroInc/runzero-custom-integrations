name: Update integrations JSON when relevant files change

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.json'
      - '**/*.star'
      - '!docs/**'

permissions:
  contents: read

jobs:
  update-integration-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed by create-pull-request to push branch
      pull-requests: write # Needed by create-pull-request and gh pr merge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run integration update script
        run: python scripts/generate_integration_json.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0 - Jan 21, 2026
        id: cpr
        with:
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          commit-message: "Auto: update integrations JSON and README"
          branch: auto/update-integrations-json
          delete-branch: true
          title: "Auto: update integrations JSON and README"
          body: |
            Automated update generated by the `Update integrations JSON when relevant files change` workflow.

            This PR refreshes the generated integrations JSON index and README.

            Source run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            automated

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge -d --merge --auto "${STEPS_CPR_OUTPUTS_PULL_REQUEST_NUMBER}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_CPR_OUTPUTS_PULL_REQUEST_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
